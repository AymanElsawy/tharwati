name: iOS unsigned build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS app (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=THARWATI_ENVIRONMENT=${{ secrets.THARWATI_ENVIRONMENT }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Package .ipa
        run: |
          rm -rf Payload tharwati.ipa
          mkdir Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry tharwati.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: tharwati-ipa
          path: apps/mobile/tharwati.ipa
