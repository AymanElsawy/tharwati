# Dedicated application smoke environment. Never use the default/linked workdir.
project_id = "TharwatiMobileDevelopment"

[api]
enabled = true
port = 58321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 58322
shadow_port = 58320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false
port = 58323

[local_smtp]
enabled = true
port = 58324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173", "http://localhost:5173", "tharwati://auth-callback"]
enable_signup = true
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = false
max_frequency = "1s"

[edge_runtime]
enabled = true
policy = "per_worker"
inspector_port = 8085
deno_version = 2

[analytics]
enabled = false
port = 58327
